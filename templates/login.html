<!DOCTYPE html>
<html lang="en" class="dark">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login - KixoGames</title>
    <meta name="robots" content="noindex, nofollow">
    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-gray-900 text-white font-sans flex items-center justify-center min-h-screen p-4">

    <div class="w-full max-w-md bg-gray-800 rounded-2xl shadow-2xl p-8 border border-gray-700">

        <div class="text-center mb-8">
            <h1
                class="text-3xl font-black text-transparent bg-clip-text bg-gradient-to-r from-blue-400 to-purple-500 tracking-wider mb-2">
                KixoGames
            </h1>
            <p class="text-gray-400 text-sm font-medium">Secure Admin Access Only</p>
        </div>

        {% if error %}
        <div
            class="bg-red-500/10 border border-red-500 text-red-400 p-3 rounded-lg text-sm font-semibold mb-5 text-center">
            ❌ {{ error }}
        </div>
        {% endif %}

        <!-- 🚀 Form Action now points to the hidden admin route -->
        <form action="/gamesecurityadmin" method="POST" class="space-y-5">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}" />

            <div>
                <label class="block text-gray-400 text-xs font-bold uppercase tracking-wider mb-2">Admin Email</label>
                <input type="email" name="email" required autocomplete="email"
                    class="w-full bg-gray-900 border border-gray-700 rounded-xl p-3 text-white focus:outline-none focus:border-blue-500 focus:ring-1 focus:ring-blue-500 transition-colors"
                    placeholder="e.g. admin@KixoGames.com">
            </div>

            <div>
                <label class="block text-gray-400 text-xs font-bold uppercase tracking-wider mb-2">Password</label>
                <input type="password" name="password" required
                    class="w-full bg-gray-900 border border-gray-700 rounded-xl p-3 text-white focus:outline-none focus:border-blue-500 focus:ring-1 focus:ring-blue-500 transition-colors">
            </div>

            <button type="submit"
                class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 rounded-xl shadow-lg transition-colors mt-4">
                Login Dashboard
            </button>
        </form>
    </div>
</body>

</html>
